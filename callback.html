<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NoxxyBot - Authenticating...</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            flex-direction: column;
        }
        .loading-card {
            background-color: #23272A;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }
        h2 {
            color: #5865F2;
            margin-bottom: 10px;
        }
        p {
            color: #b9bbbe;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="loading-card">
        <h2>Authenticating with Discord...</h2>
        <p>Please wait while we log you into NoxxyBot.</p>
    </div>

    <script>
        // Lấy mã xác thực (code) do Discord trả về trên URL
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');

        if (code) {
            // Lưu trạng thái đăng nhập vào trình duyệt
            localStorage.setItem("discord_logged_in", "true");
            
            document.querySelector("h2").innerText = "Login Successful!";
            document.querySelector("p").innerText = "Redirecting to your dashboard...";

            // Chuyển hướng người dùng về trang dashboard sau 1.5 giây
            setTimeout(() => {
                window.location.href = "dashboard.html";
            }, 1500);
        } else {
            document.querySelector("h2").innerText = "Login Failed";
            document.querySelector("p").innerText = "Authorization code not found. Redirecting...";
            
            setTimeout(() => {
                window.location.href = "index.html";
            }, 2000);
        }
    </script>
</body>
</html>
