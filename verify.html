<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NoxxyBot - Key Verification</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#090d16',
                        cardbg: '#111827',
                        accent: '#6366f1',
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-darkbg text-slate-100 font-sans antialiased min-h-screen flex flex-col justify-between">
    <header class="p-6 border-b border-slate-800/80">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <a href="index.html" class="font-black text-lg tracking-wider text-white">NOXXYBOT</a>
            <a href="index.html" class="text-xs text-slate-400 hover:text-white transition flex items-center space-x-1">
                <i data-lucide="arrow-left" class="w-4 h-4"></i>
                <span>Back to Home</span>
            </a>
        </div>
    </header>
    <main class="flex-grow flex items-center justify-center px-4 py-12">
        <div class="max-w-md w-full bg-cardbg border border-slate-800 rounded-2xl p-8 shadow-2xl text-center">
            <div class="w-12 h-12 bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 rounded-xl flex items-center justify-center mx-auto mb-6">
                <i data-lucide="shield-check" class="w-6 h-6"></i>
            </div>
            <h1 class="text-2xl font-bold mb-2">Key Verification</h1>
            <p class="text-slate-400 text-sm mb-6">Enter your HWID or authenticate with Discord to generate your execution key.</p>
            <form onsubmit="event.preventDefault(); alert('Connected to NoxxyBot API successfully!');" class="space-y-4 text-left">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">DISCORD ID / HWID</label>
                    <input type="text" placeholder="Paste your HWID here..." class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-100 focus:outline-none focus:border-indigo-500 transition">
                </div>
                <button type="submit" class="w-full py-3 rounded-xl bg-accent hover:bg-indigo-600 font-bold transition shadow-lg shadow-indigo-500/25 text-sm">
                    Verify & Get Key
                </button>
            </form>
        </div>
    </main>
    <footer class="py-6 text-center text-xs text-slate-500 border-t border-slate-800/80">
        <p>&copy; 2026 NoxxyBot Security System</p>
    </footer>
    <script>lucide.createIcons();</script>
</body>
</html>
