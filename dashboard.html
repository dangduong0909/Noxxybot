<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NoxxyBot - Dashboard</title>
    <style>
        :root {
            --bg-dark: #0f111a;
            --bg-sidebar: #161824;
            --bg-card: #1f2233;
            --text-main: #ffffff;
            --text-muted: #a1a3af;
            --accent-color: #5865F2;
            --accent-hover: #4752C4;
            --danger: #ed4245;
            --success: #3ba55c;
            --border-color: #2b2e40;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar Styling */
        .sidebar {
            width: 260px;
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 20px 0;
        }

        .brand {
            font-size: 24px;
            font-weight: bold;
            padding: 0 20px 20px;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand span {
            color: var(--accent-color);
        }

        .server-selector {
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        .server-icon {
            width: 40px;
            height: 40px;
            background-color: var(--accent-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .nav-menu {
            margin-top: 20px;
            list-style: none;
        }

        .nav-item {
            padding: 12px 20px;
            cursor: pointer;
            color: var(--text-muted);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-item:hover, .nav-item.active {
            background-color: rgba(88, 101, 242, 0.1);
            color: var(--text-main);
            border-left: 4px solid var(--accent-color);
        }

        /* Main Content Styling */
        .main-content {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 28px;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
            background-color: var(--bg-card);
            padding: 8px 15px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
        }
